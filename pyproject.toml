[project]
name = "toolstorepy"
version = "0.2.0"
description = "Automatic MCP server builder — describe tools in plain English, get a ready-to-run server."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Sujal Maheshwari", email = "sujalmaheshwari07@gmail.com"},
]
dependencies = [
    "chromadb>=1.5.0",
    "requests>=2.32.5",
    "sentence-transformers>=5.2.2",
    "transformers>=5.1.0",
    # LLM scanning (optional feature, --llm-scan flag)
    # Provider integration packages are NOT listed here because they depend
    # on which LLM the user chooses. Install the one you need, e.g.:
    #   pip install langchain-anthropic   # Claude
    #   pip install langchain-openai      # GPT
    #   pip install langchain-google-genai # Gemini
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
]

[project.urls]
Documentation = "https://tool-store-py-docs.vercel.app/"
Repository    = "https://github.com/sujal-maheshwari2004/toolstorepy"
"Bug Tracker" = "https://github.com/sujal-maheshwari2004/toolstorepy/issues"

[project.scripts]
toolstorepy = "toolstorepy.cli:main"

[tool.setuptools.packages.find]
include = ["toolstorepy*"]